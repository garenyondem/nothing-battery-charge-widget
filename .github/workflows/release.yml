name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Resolve version
        id: version
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          TAG="$RAW_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc1: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          CORE="${VERSION%%-*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CORE"

          if [[ ! "$MAJOR" =~ ^[0-9]+$ || ! "$MINOR" =~ ^[0-9]+$ || ! "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "Could not parse a version from tag: $TAG" >&2
            exit 1
          fi

          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

          {
            echo "### Glyph Charge $VERSION"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Version code: \`$CODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode and check release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "KEYSTORE_BASE64 is empty or invalid" >&2
            exit 1
          fi

          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease --no-daemon --console=plain \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Verify APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -E '^package:|^sdkVersion:|^targetSdkVersion:'

          echo "$BADGING" | grep -Fq "versionCode='$CODE'" || {
            echo "APK versionCode does not match $CODE" >&2
            exit 1
          }
          echo "$BADGING" | grep -Fq "versionName='$VERSION'" || {
            echo "APK versionName does not match $VERSION" >&2
            exit 1
          }
          if echo "$BADGING" | grep -q 'application-debuggable'; then
            echo "APK is debuggable" >&2
            exit 1
          fi

      - name: Stage release files
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail

          mkdir -p dist
          cp "${{ steps.apk.outputs.path }}" "dist/GlyphCharge-$VERSION.apk"
          cd dist
          sha256sum "GlyphCharge-$VERSION.apk" > SHA256SUMS.txt
          ls -lh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --verify-tag \
              --title "Glyph Charge ${TAG#v}" \
              --generate-notes
          fi

          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
